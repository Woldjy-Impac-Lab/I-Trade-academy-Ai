<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Débloquer un niveau — I Trade Academy AI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="dashboard.html" class="logo">I Trade Academy <strong>AI</strong></a>
    <ul class="nav-links">
      <li><a href="dashboard.html">← Mes cours</a></li>
      <li><a href="#" id="logout-link">Déconnexion</a></li>
    </ul>
  </div>
</header>

<div class="lesson-shell" id="checkout-shell">
  <p>Chargement...</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
if (typeof requireAuth !== "function") {
  document.getElementById("checkout-shell").innerHTML =
    '<div class="form-msg error" style="display:block;">' +
    'Erreur de chargement : le fichier supabase-client.js n\'a pas pu être chargé.' +
    '</div>';
  throw new Error("supabase-client.js non chargé — arrêt du script checkout.");
}

// ⚠️ Remplace ces placeholders par tes vraies informations de réception.
// Ces informations sont affichées à tout utilisateur connecté qui souhaite
// débloquer un niveau — n'y mets rien de plus qu'un numéro et un nom, jamais
// un mot de passe ou un code secret.
const PAYMENT_METHODS = {
  moncash: {
    label: "MonCash",
    instructions: "Envoie le montant via MonCash au numéro ci-dessous, puis note le numéro de référence reçu par SMS.",
    number: "+509 34981561",
    holderName: "Célestin Woldjy Junior",
  },
  natcash: {
    label: "NatCash",
    instructions: "Envoie le montant via NatCash au numéro ci-dessous, puis note le numéro de référence reçu par SMS.",
    number: "+509 42824391",
    holderName: "NOM PRÉNOM À REMPLACER",
  },
  bank_transfer: {
    label: "Virement bancaire",
    instructions: "Effectue un virement vers le compte ci-dessous, puis note la référence ou le numéro de transaction.",
    bankName: "NOM DE LA BANQUE À REMPLACER",
    accountName: "NOM DU TITULAIRE À REMPLACER",
    accountNumber: "NUMÉRO DE COMPTE À REMPLACER",
  },
};

function getParams() {
  return new URLSearchParams(window.location.search);
}

let currentUser = null;
let currentLevel = null;
let selectedMethod = null;

(async () => {
  currentUser = await requireAuth();
  if (!currentUser) return;

  const shell = document.getElementById("checkout-shell");
  const levelId = getParams().get("level");

  if (!levelId) {
    shell.innerHTML = `<p>Aucun niveau spécifié. <a href="dashboard.html">Retourner au tableau de bord</a>.</p>`;
    return;
  }

  currentLevel = await getLevelById(levelId);
  if (!currentLevel) {
    shell.innerHTML = `<p>Ce niveau est introuvable. <a href="dashboard.html">Retourner au tableau de bord</a>.</p>`;
    return;
  }

  const access = await getUserLevelAccess(currentUser.id);
  if (access.includes(levelId)) {
    shell.innerHTML = `
      <div class="checkout-status">
        <h2>✅ Niveau déjà débloqué</h2>
        <p>Tu as déjà accès au niveau ${currentLevel.name}.</p>
        <a href="dashboard.html" class="btn btn-primary">Retour au tableau de bord</a>
      </div>`;
    return;
  }

  renderCheckout(shell);
})();

function renderCheckout(shell) {
  shell.innerHTML = `
    <div class="checkout-card">
      <div class="breadcrumb"><a href="dashboard.html">Tableau de bord</a> › Débloquer un niveau</div>
      <h2>Niveau ${currentLevel.name}</h2>
      <p>${currentLevel.description || ""}</p>
      <div class="checkout-price">${Number(currentLevel.price_usd).toFixed(2)} $</div>

      <div class="checkout-methods" id="method-buttons">
        <button class="checkout-method-btn" data-method="moncash">Payer par MonCash</button>
        <button class="checkout-method-btn" data-method="natcash">Payer par NatCash</button>
        <button class="checkout-method-btn" data-method="bank_transfer">Payer par virement bancaire</button>
      </div>

      <div id="method-detail" style="margin-top:20px;"></div>

      <p style="margin-top:20px; font-size:0.82rem; color:var(--ink-soft);">
        Après avoir envoyé le paiement, soumets la référence ci-dessous. Un administrateur
        confirme la réception et débloque ton accès manuellement — généralement sous 24h.
      </p>
    </div>
  `;

  document.querySelectorAll(".checkout-method-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      selectedMethod = btn.getAttribute("data-method");
      document.querySelectorAll(".checkout-method-btn").forEach(b => b.classList.toggle("selected", b === btn));
      renderMethodDetail();
    });
  });
}

function renderMethodDetail() {
  const detail = document.getElementById("method-detail");
  const method = PAYMENT_METHODS[selectedMethod];

  let infoHtml = "";
  if (selectedMethod === "bank_transfer") {
    infoHtml = `
      <p><strong>Banque :</strong> ${method.bankName}<br>
      <strong>Titulaire :</strong> ${method.accountName}<br>
      <strong>Numéro de compte :</strong> ${method.accountNumber}</p>
    `;
  } else {
    infoHtml = `
      <p><strong>Numéro ${method.label} :</strong> ${method.number}<br>
      <strong>Titulaire :</strong> ${method.holderName}</p>
    `;
  }

  detail.innerHTML = `
    <div class="auth-card" style="max-width:none; padding:20px;">
      <h3 style="margin-top:0;">${method.label}</h3>
      <p>${method.instructions}</p>
      ${infoHtml}

      <div class="field">
        <label for="payment-reference">Référence / numéro de transaction reçu</label>
        <input type="text" id="payment-reference" class="admin-inline-field" placeholder="Ex : MP240915.1234.A56789">
      </div>

      <div class="field">
        <label for="proof-file">Capture d'écran de la confirmation (optionnel)</label>
        <input type="file" id="proof-file" accept="image/*">
      </div>

      <div id="checkout-msg" class="form-msg"></div>
      <button class="btn btn-primary btn-block" id="submit-payment-btn">J'ai envoyé le paiement</button>
    </div>
  `;

  document.getElementById("submit-payment-btn").addEventListener("click", handleSubmitPayment);
}

async function handleSubmitPayment() {
  const msg = document.getElementById("checkout-msg");
  const reference = document.getElementById("payment-reference").value.trim();
  const proofFile = document.getElementById("proof-file").files[0];

  if (!reference) {
    msg.textContent = "Indique la référence ou le numéro de transaction reçu.";
    msg.className = "form-msg error";
    return;
  }

  const btn = document.getElementById("submit-payment-btn");
  btn.disabled = true;
  btn.textContent = "Envoi...";

  let proofPath = null;
  if (proofFile) {
    proofPath = await uploadPaymentProof(currentUser.id, proofFile);
    if (!proofPath) {
      msg.textContent = "Erreur lors de l'envoi de la capture d'écran. Vérifie que le bucket \"payment-proofs\" est configuré (supabase/storage-payment-proofs-setup.sql), ou réessaie sans capture.";
      msg.className = "form-msg error";
      btn.disabled = false;
      btn.textContent = "J'ai envoyé le paiement";
      return;
    }
  }

  const created = await createManualPayment(
    currentUser.id,
    currentLevel.id,
    currentLevel.price_usd,
    selectedMethod,
    reference,
    proofPath
  );

  btn.disabled = false;
  btn.textContent = "J'ai envoyé le paiement";

  if (!created) {
    msg.textContent = "Erreur lors de l'enregistrement. Réessaie dans un instant.";
    msg.className = "form-msg error";
    return;
  }

  document.getElementById("checkout-shell").innerHTML = `
    <div class="checkout-status">
      <h2>Paiement soumis</h2>
      <p>Ta référence a été transmise. Un administrateur va confirmer la réception du paiement
      et débloquer ton accès au niveau ${currentLevel.name} manuellement — tu recevras l'accès
      dès que ce sera fait.</p>
      <a href="dashboard.html" class="btn btn-primary">Retour au tableau de bord</a>
    </div>
  `;
}

document.getElementById("logout-link").addEventListener("click", (e) => {
  e.preventDefault();
  signOut();
});
</script>

</body>
</html>
