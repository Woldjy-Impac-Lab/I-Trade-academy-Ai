<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Débloquer un niveau — I Trade Academy AI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="dashboard.html" class="logo">I Trade Academy <strong>AI</strong></a>
    <ul class="nav-links">
      <li><a href="dashboard.html">← Mes cours</a></li>
      <li><a href="#" id="logout-link">Déconnexion</a></li>
    </ul>
  </div>
</header>

<div class="lesson-shell" id="checkout-shell">
  <p>Chargement...</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
if (typeof requireAuth !== "function") {
  document.getElementById("checkout-shell").innerHTML =
    '<div class="form-msg error" style="display:block;">' +
    'Erreur de chargement : le fichier supabase-client.js n\'a pas pu être chargé.' +
    '</div>';
  throw new Error("supabase-client.js non chargé — arrêt du script checkout.");
}

// Remplace par le Client ID PayPal réel (publique, sans danger à exposer)
// une fois le compte marchand configuré. Tant que ce placeholder est en
// place, le bouton PayPal affiche un message au lieu de charger le SDK.
const PAYPAL_CLIENT_ID = "REMPLACER_PAR_VOTRE_PAYPAL_CLIENT_ID";

function getParams() {
  return new URLSearchParams(window.location.search);
}

(async () => {
  const user = await requireAuth();
  if (!user) return;

  const shell = document.getElementById("checkout-shell");
  const params = getParams();
  const levelId = params.get("level");
  const status = params.get("status"); // "success" | "cancelled" (retour Stripe)

  if (!levelId) {
    shell.innerHTML = `<p>Aucun niveau spécifié. <a href="dashboard.html">Retourner au tableau de bord</a>.</p>`;
    return;
  }

  const level = await getLevelById(levelId);
  if (!level) {
    shell.innerHTML = `<p>Ce niveau est introuvable. <a href="dashboard.html">Retourner au tableau de bord</a>.</p>`;
    return;
  }

  const access = await getUserLevelAccess(user.id);
  if (access.includes(levelId)) {
    shell.innerHTML = `
      <div class="checkout-status">
        <h2>✅ Niveau déjà débloqué</h2>
        <p>Tu as déjà accès au niveau ${level.name}.</p>
        <a href="dashboard.html" class="btn btn-primary">Retour au tableau de bord</a>
      </div>`;
    return;
  }

  // Retour depuis Stripe Checkout : la confirmation réelle vient du webhook
  // (asynchrone), donc on affiche un état d'attente et on vérifie
  // périodiquement si l'accès a été accordé, plutôt que de faire confiance
  // au simple retour d'URL.
  if (status === "success") {
    shell.innerHTML = `
      <div class="checkout-status">
        <h2>Paiement reçu — confirmation en cours</h2>
        <p>Ton paiement est en cours de validation. L'accès au niveau ${level.name} se débloque automatiquement dès que la confirmation est reçue — cela prend généralement quelques secondes.</p>
        <p id="poll-status" style="color:var(--ink-soft); font-size:0.9rem;">Vérification en cours...</p>
        <a href="dashboard.html" class="btn btn-outline" style="margin-top:10px;">Retourner au tableau de bord</a>
      </div>`;
    const granted = await pollForLevelAccess(user.id, levelId, 20, 3000);
    const pollMsg = document.getElementById("poll-status");
    if (granted) {
      window.location.href = "dashboard.html";
    } else if (pollMsg) {
      pollMsg.textContent = "La confirmation prend plus de temps que prévu. Vérifie ton tableau de bord dans quelques minutes, ou contacte le support si l'accès n'apparaît pas.";
    }
    return;
  }

  if (status === "cancelled") {
    // Continue vers l'affichage normal du checkout, avec un message de rappel.
  }

  renderCheckout(shell, user, level, status === "cancelled");
})();

function renderCheckout(shell, user, level, wasCancelled) {
  shell.innerHTML = `
    <div class="checkout-card">
      <div class="breadcrumb"><a href="dashboard.html">Tableau de bord</a> › Débloquer un niveau</div>
      <h2>Niveau ${level.name}</h2>
      <p>${level.description || ""}</p>
      <div class="checkout-price">${Number(level.price_usd).toFixed(2)} $</div>
      ${wasCancelled ? `<div class="form-msg error" style="display:block;">Le paiement a été annulé. Tu peux réessayer ci-dessous.</div>` : ""}
      <div id="checkout-msg" class="form-msg"></div>
      <div class="checkout-methods">
        <button class="checkout-method-btn stripe" id="stripe-btn">Payer par carte (Stripe)</button>
        <div id="paypal-button-container"></div>
      </div>
      <p style="margin-top:20px; font-size:0.82rem; color:var(--ink-soft);">
        Paiement sécurisé. La confirmation finale et l'attribution de l'accès sont vérifiées côté serveur avant d'être accordées.
      </p>
    </div>
  `;

  function showMsg(text, type) {
    const msg = document.getElementById("checkout-msg");
    msg.textContent = text;
    msg.className = "form-msg " + type;
  }

  document.getElementById("stripe-btn").addEventListener("click", async () => {
    const btn = document.getElementById("stripe-btn");
    btn.disabled = true;
    btn.textContent = "Redirection...";
    const { data, error } = await invokeEdgeFunction("create-checkout-session", { level_id: level.id });
    if (error || !data?.url) {
      showMsg("Le paiement par carte n'est pas encore configuré sur ce projet (fonction serveur \"create-checkout-session\" non déployée). Voir supabase/functions/README.md.", "error");
      btn.disabled = false;
      btn.textContent = "Payer par carte (Stripe)";
      return;
    }
    window.location.href = data.url;
  });

  setupPaypalButton(user, level, showMsg);
}

function setupPaypalButton(user, level, showMsg) {
  const container = document.getElementById("paypal-button-container");

  if (!PAYPAL_CLIENT_ID || PAYPAL_CLIENT_ID.startsWith("REMPLACER_")) {
    container.innerHTML = `<p style="font-size:0.85rem; color:var(--ink-soft); text-align:center;">Le paiement PayPal n'est pas encore configuré sur ce projet.</p>`;
    return;
  }

  const script = document.createElement("script");
  script.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(PAYPAL_CLIENT_ID)}&currency=USD`;
  script.onload = () => {
    if (!window.paypal) return;
    window.paypal.Buttons({
      createOrder: async () => {
        const { data, error } = await invokeEdgeFunction("paypal-create-order", { level_id: level.id });
        if (error || !data?.orderId) {
          showMsg("Impossible de créer la commande PayPal pour le moment.", "error");
          throw new Error("paypal-create-order failed");
        }
        return data.orderId;
      },
      onApprove: async (data) => {
        const result = await invokeEdgeFunction("paypal-capture-order", { order_id: data.orderID });
        if (result.error || !result.data?.success) {
          showMsg("Le paiement PayPal n'a pas pu être confirmé.", "error");
          return;
        }
        window.location.href = `checkout.html?level=${level.id}&status=success`;
      },
      onError: () => {
        showMsg("Une erreur est survenue avec PayPal.", "error");
      }
    }).render("#paypal-button-container");
  };
  script.onerror = () => {
    container.innerHTML = `<p style="font-size:0.85rem; color:var(--ink-soft); text-align:center;">Impossible de charger PayPal.</p>`;
  };
  document.body.appendChild(script);
}

document.getElementById("logout-link").addEventListener("click", (e) => {
  e.preventDefault();
  signOut();
});
</script>

</body>
</html>
