<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord — I Trade Academy AI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="dashboard.html" class="logo">I Trade Academy <strong>AI</strong></a>
    <ul class="nav-links">
      <li id="user-name"></li>
      <li><a href="#" id="logout-link">Déconnexion</a></li>
    </ul>
  </div>
</header>

<div class="container dash-layout">
  <nav class="dash-nav">
    <a href="dashboard.html" class="active">Mes cours</a>
    <a href="#" title="Débloqué après le niveau Intermédiaire">Simulateur</a>
    <a href="#" title="Bientôt disponible">Atlas — Coach IA</a>
    <a href="#" title="Bientôt disponible">Journal de trading</a>
    <a href="#" title="Bientôt disponible">Communauté</a>
    <a href="#" title="Bientôt disponible">Certificats</a>
    <a href="admin.html" id="admin-nav-link" style="display:none;">⚙ Administration</a>
  </nav>

  <main>
    <h2>Ma progression</h2>
    <p id="level-summary">Chargement...</p>
    <div id="courses-container"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
if (typeof requireAuth !== "function") {
  document.querySelector("main").innerHTML =
    '<div class="form-msg error" style="display:block;">' +
    'Erreur de chargement : le fichier js/supabase-client.js n\'a pas pu être chargé. ' +
    'Vérifie qu\'il existe bien au chemin "js/supabase-client.js" à côté de dashboard.html, ' +
    'et regarde l\'onglet Réseau des outils de développement pour voir le code d\'erreur (404, etc.).' +
    '</div>';
  throw new Error("supabase-client.js non chargé — arrêt du script dashboard.");
}

(async () => {
  const user = await requireAuth();
  if (!user) return;

  const profile = await getCurrentProfile();
  document.getElementById("user-name").textContent = profile?.full_name || user.email;
  if (profile?.role === "admin") {
    document.getElementById("admin-nav-link").style.display = "";
  }

  const [levels, access, completedIds] = await Promise.all([
    getLevelsWithCourses(),
    getUserLevelAccess(user.id),
    getUserCompletedLessonIds(user.id)
  ]);

  const currentLevelName = levels.find(l => l.id === profile?.current_level)?.name || "Débutant";
  document.getElementById("level-summary").textContent =
    `Niveau actuel : ${currentLevelName}. Niveaux débloqués : ${access.length} sur ${levels.length}.`;

  const container = document.getElementById("courses-container");

  if (levels.length === 0) {
    container.innerHTML = `<p>Le contenu académique n'a pas encore été chargé dans Supabase. Un administrateur doit ajouter les cours, modules et leçons (voir <code>supabase/schema.sql</code> et le tableau de bord admin).</p>`;
    return;
  }

  levels.forEach(level => {
    const unlocked = access.includes(level.id);
    const section = document.createElement("section");
    section.style.marginBottom = "36px";

    const heading = document.createElement("h3");
    heading.textContent = `${level.name} ${unlocked ? "" : "🔒 (" + level.price_usd + " $)"}`;
    section.appendChild(heading);

    level.courses.forEach(course => {
      const totalLessons = course.modules.reduce((sum, m) => sum + m.lessons.length, 0);
      const doneLessons = course.modules.reduce(
        (sum, m) => sum + m.lessons.filter(l => completedIds.has(l.id)).length, 0
      );
      const pct = totalLessons ? Math.round((doneLessons / totalLessons) * 100) : 0;

      // Première leçon non terminée du cours, pour le bouton "Continuer"
      let firstIncompleteLesson = null;
      for (const m of course.modules) {
        for (const l of m.lessons) {
          if (!completedIds.has(l.id)) { firstIncompleteLesson = l; break; }
        }
        if (firstIncompleteLesson) break;
      }
      const continueLessonId = firstIncompleteLesson
        ? firstIncompleteLesson.id
        : (course.modules[0]?.lessons[0]?.id || null);

      const block = document.createElement("div");
      block.className = "course-block";
      block.innerHTML = `
        <h4 style="margin:0 0 4px;">${course.title}</h4>
        <div class="progress-bar"><span style="width:${pct}%"></span></div>
        <p style="margin:0; font-size:0.85rem; color:var(--ink-soft);">${doneLessons} / ${totalLessons} leçons — ${pct}%</p>
        ${course.modules.map(m => `
          <div class="module-row" style="display:block;">
            <div style="display:flex; justify-content:space-between; font-weight:600; margin-bottom:6px;">
              <span>${m.title}</span>
              <span class="badge">${m.lessons.length} leçons</span>
            </div>
            <ul style="list-style:none; margin:0 0 10px; padding:0;">
              ${m.lessons.map(l => {
                const done = completedIds.has(l.id);
                if (!unlocked) {
                  return `<li style="padding:4px 0; color:var(--ink-soft); font-size:0.9rem;">🔒 ${l.title}</li>`;
                }
                return `<li style="padding:4px 0; font-size:0.9rem;">
                  <a href="lesson.html?id=${l.id}" style="text-decoration:none; color:${done ? "var(--forest-dark)" : "var(--ink)"};">
                    ${done ? "✓" : "○"} ${l.title}
                  </a>
                </li>`;
              }).join("")}
            </ul>
          </div>
        `).join("")}
        ${unlocked
          ? `<div style="margin-top:4px; display:flex; gap:10px; flex-wrap:wrap;">
              <a href="lesson.html?id=${continueLessonId}" class="btn btn-outline">${doneLessons > 0 ? "Continuer" : "Commencer"}</a>
              ${doneLessons === totalLessons && totalLessons > 0
                ? `<a href="quiz.html?course=${course.id}" class="btn btn-primary">Passer le quiz</a>`
                : `<span class="badge" style="align-self:center;">Quiz débloqué après les ${totalLessons} leçons</span>`}
            </div>`
          : `<div style="margin-top:4px;"><a href="checkout.html?level=${level.id}" class="btn btn-primary">Débloquer ce niveau</a></div>`}
      `;
      section.appendChild(block);
    });

    container.appendChild(section);
  });
})();

document.getElementById("logout-link").addEventListener("click", (e) => {
  e.preventDefault();
  signOut();
});
</script>

</body>
</html>
